name: Markdown links

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'docs/**'
      - 'scripts/check-markdown-links.mjs'
      - 'scripts/redirects.mjs'
      - '.vitepress/config/rewrites.json'
      - '.github/workflows/markdown-links.yml'
      - 'package.json'

jobs:
  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Fetch base branch for diff
        env:
          BASE_REF: ${{ github.base_ref }}
        # Three-dot diff needs a merge base. --depth=1 leaves origin/$BASE_REF as a shallow tip and git exits with "no merge base".
        run: git fetch --no-tags origin "$BASE_REF"
      - name: Check links in changed markdown
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: pnpm run check:links:changed
      # a moved or deleted page must not leave a redirect pointing nowhere;
      # runs even when the link check failed, so both errors show up at once
      - name: Check redirects
        if: ${{ !cancelled() }}
        run: pnpm run check:redirects
