name: Disk check (deploy host)

on:
  workflow_dispatch: {}

jobs:
  disk-check:
    if: github.repository_owner == 'modx-pro'
    runs-on: ubuntu-latest
    steps:
      - name: Check remote disk
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set +e
            echo '=== df -h ==='
            df -h /
            echo
            echo '=== $HOME breakdown ==='
            du -xhd1 "$HOME" 2>/dev/null | sort -hr
            echo
            echo '=== www ==='
            du -xhd1 "$HOME/www" 2>/dev/null | sort -hr | head -40
            echo
            echo '=== logs (top files) ==='
            du -xhd1 "$HOME/logs" 2>/dev/null | sort -hr | head -20
            ls -lahS "$HOME/logs" 2>/dev/null | head -30
            echo
            echo '=== tmp ==='
            du -sh "$HOME/tmp" 2>/dev/null
            ls -lahS "$HOME/tmp" 2>/dev/null | head -20
            echo
            echo '=== other /var/www (names only; sizes may be inaccessible) ==='
            ls -la /var/www 2>/dev/null
            echo
            echo '=== can sudo? ==='
            sudo -n true 2>&1 | head -5
            echo
            echo '=== reserved blocks ==='
            tune2fs -l /dev/vda1 2>/dev/null | rg -i 'reserved|block count|free' || echo 'no tune2fs'
