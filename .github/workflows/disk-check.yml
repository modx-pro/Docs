name: Disk check (deploy host)

on:
  workflow_dispatch: {}

jobs:
  disk-check:
    if: github.repository_owner == 'modx-pro'
    runs-on: ubuntu-latest
    steps:
      - name: Check remote disk
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set +e
            echo '=== file.modx.pro ==='
            du -xhd1 "$HOME/www/file.modx.pro" 2>/dev/null | sort -hr | head -30
            echo
            echo '=== file.modx.pro deep ==='
            du -xhd2 "$HOME/www/file.modx.pro" 2>/dev/null | sort -hr | head -40
            echo
            echo '=== modx.pro ==='
            du -xhd1 "$HOME/www/modx.pro" 2>/dev/null | sort -hr | head -20
            echo
            echo '=== docs.modx.pro ==='
            du -xhd1 "$HOME/www/docs.modx.pro" 2>/dev/null | sort -hr | head -20
            echo
            echo '=== log writability ==='
            touch "$HOME/logs/_write_test" 2>&1
            rm -f "$HOME/logs/_write_test" 2>&1
            ls -ld "$HOME/logs"
