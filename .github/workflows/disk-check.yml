name: Disk check (deploy host)

on:
  workflow_dispatch: {}

jobs:
  disk-check:
    if: github.repository_owner == 'modx-pro'
    runs-on: ubuntu-latest
    steps:
      - name: Check remote disk
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set +e
            echo '=== df -h ==='
            df -h
            echo
            echo '=== /var breakdown ==='
            du -xhd1 /var 2>/dev/null | sort -hr | head -30
            echo
            echo '=== /var/www ==='
            du -xhd2 /var/www 2>/dev/null | sort -hr | head -40
            echo
            echo '=== /home ==='
            du -xhd2 /home 2>/dev/null | sort -hr | head -30
            echo
            echo '=== largest dirs under / ==='
            du -xhd1 / 2>/dev/null | sort -hr | head -20
            echo
            echo '=== journal ==='
            journalctl --disk-usage 2>/dev/null || true
            echo
            echo '=== docker ==='
            docker system df 2>/dev/null || echo 'no docker'
            echo
            echo '=== apt/dpkg caches ==='
            du -sh /var/cache/apt /var/lib/apt /var/lib/dpkg 2>/dev/null
            echo
            echo '=== large files >200M ==='
            find / -xdev -type f -size +200M 2>/dev/null | head -40
            echo
            echo '=== deleted but open (need root) ==='
            lsof 2>/dev/null | awk '/deleted/ {print}' | head -20 || true
            echo
            echo '=== whoami / id ==='
            whoami; id; pwd; ls -la ~
