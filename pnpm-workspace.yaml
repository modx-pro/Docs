# Настройки pnpm. С pnpm 11 .npmrc читается только для авторизации и реестра,
# а блок "pnpm" в package.json не читается вовсе.

# скрипты package.json в POSIX-синтаксисе (NODE_OPTIONS=... в build) работают и на Windows
shellEmulator: true

overrides:
  nanoid: ^3.3.18
  handlebars: ^4.7.9
  js-yaml@3: 3.15.2
  lodash-es: ^4.18.0
  mdast-util-to-hast: ^13.2.1

peerDependencyRules:
  ignoreMissing:
    - '@algolia/client-search'

# pnpm 11 не ставит версии моложе суток (minimumReleaseAge);
# подсветка Fenom — собственный пакет, его новые версии нужны сразу
minimumReleaseAgeExclude:
  - '@gulomov/fenom-tmlanguage'
